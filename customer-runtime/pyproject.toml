[project]
name = "ra-customer-runtime"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "sentence-transformers>=2.7",
  "pgvector>=0.3",
  "boto3>=1.34",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "slowapi>=0.1.9",
  "reportlab>=4.1",
  "httpx>=0.27",
  "arq>=0.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "testcontainers[postgres,redis]>=4.0",
  "ruff>=0.4",
  "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "integration: marks tests requiring external services (e.g., PostgreSQL container)",
  "no_template_mock: disables autouse Template API test mocks",
]

[tool.coverage.run]
source = ["src/app"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
