name: 도메인 + SSL 설정 (ra.abyz-lab.work)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DNS 레코드만 추가하고 인증서 바인딩은 건너뜀 (DNS 전파 확인용)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: api-prod
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  HOSTNAME: ra.abyz-lab.work
  APP_FQDN: api-prod.victoriousforest-c9f2300f.koreacentral.azurecontainerapps.io
  VERIFICATION_TOKEN: 7BEBBF108829FD1C566EB7C706302B723DEF34E071B2C94871F71195787CD73A
  CAE_NAME: cae-hybrid-ra-saas-staging
  CAE_RG: rg-hybrid-ra-saas-staging

jobs:
  setup-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure 로그인 (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Cloudflare DNS 레코드 추가
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # CNAME: ra.abyz-lab.work → api-prod FQDN (proxy OFF)
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"CNAME\",\"name\":\"ra\",\"content\":\"${{ env.APP_FQDN }}\",\"ttl\":300,\"proxied\":false}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('CNAME:', 'OK' if r['success'] else r['errors'])"

          # TXT: asuid.ra.abyz-lab.work → verification token
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"TXT\",\"name\":\"asuid.ra\",\"content\":\"${{ env.VERIFICATION_TOKEN }}\",\"ttl\":300}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('TXT:', 'OK' if r['success'] else r['errors'])"

      - name: DNS 전파 대기 (최대 5분)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          echo "DNS 전파 확인 중..."
          for i in $(seq 1 10); do
            CNAME=$(dig +short CNAME ra.abyz-lab.work @1.1.1.1 2>/dev/null || true)
            TXT=$(dig +short TXT asuid.ra.abyz-lab.work @1.1.1.1 2>/dev/null || true)
            echo "[$i/10] CNAME=$CNAME TXT=$TXT"
            if echo "$CNAME" | grep -q "azurecontainerapps" && echo "$TXT" | grep -qi "${{ env.VERIFICATION_TOKEN }}"; then
              echo "DNS 전파 완료"
              break
            fi
            sleep 30
          done

      - name: Container App hostname 바인딩
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          az containerapp hostname add \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --hostname "${{ env.HOSTNAME }}"

          az containerapp hostname bind \
            --name "${{ env.APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --hostname "${{ env.HOSTNAME }}" \
            --environment "${{ env.CAE_NAME }}" \
            --environment-resource-group "${{ env.CAE_RG }}" \
            --certificate-type Managed

          echo "완료: https://${{ env.HOSTNAME }}"

      - name: 헬스체크 (커스텀 도메인)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          curl -f --max-time 30 --retry 5 --retry-delay 10 \
            "https://${{ env.HOSTNAME }}/health" && echo "OK"
