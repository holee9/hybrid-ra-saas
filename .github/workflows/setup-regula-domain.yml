name: 도메인 + SSL 설정 (regula.abyz-lab.work)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DNS만 추가, Vercel 바인딩 건너뜀 (DNS 전파 확인용)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  HOSTNAME: regula.abyz-lab.work

jobs:
  setup-regula-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare DNS — CNAME regula → cname.vercel-dns.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # 기존 레코드 확인 (중복 방지)
          EXISTING=$(curl -sf "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=CNAME&name=regula.abyz-lab.work" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(len(r.get('result', [])))")
          echo "기존 CNAME 레코드 수: $EXISTING"

          if [ "$EXISTING" -gt "0" ]; then
            echo "CNAME 이미 존재 — 건너뜀"
          else
            # proxied: false 필수 — Vercel 도메인 소유권 검증 중 proxy ON 불가
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"regula\",\"content\":\"cname.vercel-dns.com\",\"ttl\":300,\"proxied\":false}" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('CNAME:', 'OK' if r['success'] else r['errors'])"
          fi

      - name: DNS 전파 대기 (최대 6분)
        run: |
          echo "DNS 전파 확인 중..."
          for i in $(seq 1 12); do
            CNAME=$(dig +short CNAME regula.abyz-lab.work @1.1.1.1 2>/dev/null || true)
            echo "[$i/12] CNAME=$CNAME"
            if echo "$CNAME" | grep -qi "vercel"; then
              echo "DNS 전파 완료"
              break
            fi
            sleep 30
          done

      - name: Vercel — 도메인 바인딩 + NEXTAUTH_URL 업데이트
        if: ${{ inputs.dry_run == 'false' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # 도메인 추가
          DOMAIN_RESP=$(curl -sf -X POST "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"regula.abyz-lab.work"}')
          echo "Vercel 도메인 응답: $DOMAIN_RESP"

          # NEXTAUTH_URL 환경변수 ID 조회
          ENV_ID=$(curl -sf "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import sys, json
          envs = json.load(sys.stdin).get('envs', [])
          for e in envs:
              if e.get('key') == 'NEXTAUTH_URL' and 'production' in e.get('target', []):
                  print(e['id'])
                  break
          ")

          if [ -n "$ENV_ID" ]; then
            curl -sf -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"value":"https://regula.abyz-lab.work","target":["production"]}' \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('NEXTAUTH_URL 업데이트:', r.get('value','ERROR'))"
          else
            curl -sf -X POST "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '[{"key":"NEXTAUTH_URL","value":"https://regula.abyz-lab.work","target":["production"],"type":"plain"}]' \
              | python3 -c "import sys,json; print('NEXTAUTH_URL 추가:', json.load(sys.stdin))"
          fi

      - name: 완료 안내
        run: |
          echo "======================================================"
          echo "완료: regula.abyz-lab.work 도메인 설정"
          echo ""
          echo "남은 수동 작업:"
          echo "1. ra-med-bot Vercel 대시보드 → 도메인 검증 확인"
          echo "2. ra-med-bot Redeploy (NEXTAUTH_URL 적용)"
          echo "3. https://regula.abyz-lab.work 로그인 E2E 확인"
          echo "======================================================"
