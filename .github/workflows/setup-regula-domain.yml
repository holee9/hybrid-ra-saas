name: 도메인 DNS 설정 (regula.abyz-lab.work)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DNS 레코드 확인만 하고 추가하지 않음"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  setup-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare DNS — CNAME regula → cname.vercel-dns.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          EXISTING=$(curl -sf "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?type=CNAME&name=regula.abyz-lab.work" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(len(r.get('result', [])))")

          echo "기존 CNAME 레코드 수: $EXISTING"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run 모드 — DNS 추가 건너뜀"
            exit 0
          fi

          if [ "$EXISTING" -gt "0" ]; then
            echo "CNAME 이미 존재 — 건너뜀"
          else
            # proxied: false 필수 — Vercel 도메인 소유권 검증 중 proxy ON 불가
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"type":"CNAME","name":"regula","content":"cname.vercel-dns.com","ttl":300,"proxied":false}' \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print('CNAME:', 'OK' if r['success'] else r['errors'])"
          fi

      - name: DNS 전파 확인 (최대 6분)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          for i in $(seq 1 12); do
            CNAME=$(dig +short CNAME regula.abyz-lab.work @1.1.1.1 2>/dev/null || true)
            echo "[$i/12] CNAME=$CNAME"
            if echo "$CNAME" | grep -qi "vercel"; then
              echo "DNS 전파 완료"
              break
            fi
            sleep 30
          done

      - name: 완료 — 다음 단계 안내
        run: |
          echo "======================================================"
          echo "Cloudflare DNS 설정 완료: regula.abyz-lab.work"
          echo ""
          echo "Vercel 측 작업 (ra-med-bot 레포에서 처리):"
          echo "1. Vercel 대시보드 → ra-med-bot → Domains → regula.abyz-lab.work 추가"
          echo "2. NEXTAUTH_URL=https://regula.abyz-lab.work 환경변수 업데이트"
          echo "3. Redeploy 후 https://regula.abyz-lab.work 접속 확인"
          echo "======================================================"
