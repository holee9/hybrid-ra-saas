name: Deploy — Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  id-token: write   # OIDC 토큰 발급 필수
  contents: read

env:
  APP_NAME: api
  CRAWLER_APP_NAME: cloud-control-plane-api
  SUFFIX: staging
  RESOURCE_GROUP: rg-hybrid-ra-saas-staging
  CONTAINER_APP_ENV: ${{ secrets.AZURE_CONTAINER_APP_ENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Azure 로그인 (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 로그인
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Docker 빌드 및 ACR 푸시 (customer-runtime)
        env:
          IMAGE: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.APP_NAME }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f customer-runtime/docker/Dockerfile -t $IMAGE:$TAG -t $IMAGE:$SUFFIX-latest customer-runtime/
          docker push $IMAGE:$TAG
          docker push $IMAGE:$SUFFIX-latest
          echo "IMAGE_TAG=$IMAGE:$TAG" >> $GITHUB_ENV

      - name: Docker 빌드 및 ACR 푸시 (cloud-control-plane)
        env:
          IMAGE_CRAWLER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.CRAWLER_APP_NAME }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f cloud-control-plane/docker/Dockerfile -t $IMAGE_CRAWLER:$TAG -t $IMAGE_CRAWLER:$SUFFIX-latest cloud-control-plane/
          docker push $IMAGE_CRAWLER:$TAG
          docker push $IMAGE_CRAWLER:$SUFFIX-latest
          echo "IMAGE_CRAWLER_TAG=$IMAGE_CRAWLER:$TAG" >> $GITHUB_ENV

      - name: Container App 배포 (customer-runtime)
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          containerAppName: ${{ env.APP_NAME }}-${{ env.SUFFIX }}
          imageToDeploy: ${{ env.IMAGE_TAG }}
          targetPort: 8000

      - name: Container App 배포 (cloud-control-plane)
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          containerAppName: ${{ env.CRAWLER_APP_NAME }}-${{ env.SUFFIX }}
          imageToDeploy: ${{ env.IMAGE_CRAWLER_TAG }}
          targetPort: 8000

      - name: 헬스체크
        run: |
          sleep 15
          URL=$(az containerapp show \
            --name ${{ env.APP_NAME }}-${{ env.SUFFIX }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f "https://$URL/health" || exit 1
