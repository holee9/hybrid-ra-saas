name: Deploy — Production

on:
  push:
    tags:
      - 'v*'   # v1.0.0 형식 태그 시 트리거

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: api        # TODO: 앱 이름
  CRAWLER_APP_NAME: cloud-control-plane-api
  CRAWLER_JOB_NAME: crawler-job
  SUFFIX: prod
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_ENV: ${{ secrets.AZURE_CONTAINER_APP_ENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # GitHub Environment 보호 규칙 적용

    steps:
      - uses: actions/checkout@v4

      - name: 버전 추출
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Azure 로그인 (OIDC)
        id: azure-login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 로그인
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Docker 빌드 및 ACR 푸시 (customer-runtime)
        env:
          IMAGE: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.APP_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f customer-runtime/docker/Dockerfile -t $IMAGE:$VERSION -t $IMAGE:latest customer-runtime/
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
          echo "IMAGE_TAG=$IMAGE:$VERSION" >> $GITHUB_ENV

      - name: Docker 빌드 및 ACR 푸시 (crawler)
        env:
          IMAGE_CRAWLER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.CRAWLER_APP_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f cloud-control-plane/docker/Dockerfile -t $IMAGE_CRAWLER:$VERSION -t $IMAGE_CRAWLER:latest cloud-control-plane/
          docker push $IMAGE_CRAWLER:$VERSION
          docker push $IMAGE_CRAWLER:latest
          echo "IMAGE_CRAWLER_TAG=$IMAGE_CRAWLER:$VERSION" >> $GITHUB_ENV

      - name: Container App 배포
        id: deploy
        run: |
          APP=${{ env.APP_NAME }}-${{ env.SUFFIX }}
          RG=${{ env.RESOURCE_GROUP }}
          ENV_RG=rg-hybrid-ra-saas-staging
          if az containerapp show --name "$APP" --resource-group "$RG" --query name -o tsv 2>/dev/null | grep -q "$APP"; then
            az containerapp update --name "$APP" --resource-group "$RG" --image ${{ env.IMAGE_TAG }}
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment ${{ env.CONTAINER_APP_ENV }} \
              --environment-resource-group "$ENV_RG" \
              --image ${{ env.IMAGE_TAG }} \
              --target-port 8000 \
              --ingress external \
              --min-replicas 1 \
              --registry-server ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          fi

      - name: Crawler Container App 배포
        run: |
          az containerapp update \
            --name ${{ env.CRAWLER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_CRAWLER_TAG }}

      - name: Crawler Job 배포
        run: |
          az containerapp job update \
            --name ${{ env.CRAWLER_JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_CRAWLER_TAG }}

      - name: 헬스체크
        id: health
        run: |
          sleep 20
          URL=$(az containerapp show \
            --name ${{ env.APP_NAME }}-${{ env.SUFFIX }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f "https://$URL/health" || exit 1
          echo "PROD_URL=https://$URL" >> $GITHUB_OUTPUT

      - name: 배포 실패 시 자동 롤백
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          PREV=$(az containerapp revision list \
            --name ${{ env.APP_NAME }}-${{ env.SUFFIX }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[-2].name" -o tsv)
          az containerapp ingress traffic set \
            --name ${{ env.APP_NAME }}-${{ env.SUFFIX }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision-weight $PREV=100
          echo "::error::헬스체크 실패 — 이전 revision으로 롤백 완료"
