name: Deploy — Production

on:
  push:
    tags:
      - 'v*'   # v1.0.0 형식 태그 시 트리거

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: api
  CRAWLER_APP_NAME: cloud-control-plane-api
  CRAWLER_JOB_NAME: crawler-job
  SUFFIX: prod
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  STORAGE_ACCOUNT: sthybridrasaasprod
  KEY_VAULT: kv-hybrid-ra-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 버전 추출
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Azure 로그인 (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 로그인
        run: az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

      - name: Docker 빌드 및 ACR 푸시 (customer-runtime)
        env:
          IMAGE: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.APP_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f customer-runtime/docker/Dockerfile -t $IMAGE:$VERSION -t $IMAGE:latest customer-runtime/
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
          echo "IMAGE_TAG=$IMAGE:$VERSION" >> $GITHUB_ENV

      - name: Docker 빌드 및 ACR 푸시 (crawler)
        env:
          IMAGE_CRAWLER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/${{ env.CRAWLER_APP_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build -f cloud-control-plane/docker/Dockerfile -t $IMAGE_CRAWLER:$VERSION -t $IMAGE_CRAWLER:latest cloud-control-plane/
          docker push $IMAGE_CRAWLER:$VERSION
          docker push $IMAGE_CRAWLER:latest
          echo "IMAGE_CRAWLER_TAG=$IMAGE_CRAWLER:$VERSION" >> $GITHUB_ENV

      - name: 공통 시크릿 값 로드
        run: |
          KV="${{ env.KEY_VAULT }}"
          RG="${{ env.RESOURCE_GROUP }}"

          DB_CONN=$(az keyvault secret show --vault-name "$KV" --name DB-CONNECTION-STRING --query value -o tsv)
          JWT_SEC=$(az keyvault secret show --vault-name "$KV" --name JWT-SECRET --query value -o tsv)
          APPI_CONN=$(az keyvault secret show --vault-name "$KV" --name APP-INSIGHTS-CONN-STRING --query value -o tsv)
          BLOB_KEY=$(az storage account keys list \
            --account-name "${{ env.STORAGE_ACCOUNT }}" \
            --resource-group "$RG" \
            --query "[0].value" -o tsv)

          # Mask all secret values in logs
          echo "::add-mask::$DB_CONN"
          echo "::add-mask::$JWT_SEC"
          echo "::add-mask::$APPI_CONN"
          echo "::add-mask::$BLOB_KEY"

          # Export for subsequent steps
          echo "DB_CONN=$DB_CONN" >> $GITHUB_ENV
          echo "JWT_SEC=$JWT_SEC" >> $GITHUB_ENV
          echo "APPI_CONN=$APPI_CONN" >> $GITHUB_ENV
          echo "BLOB_KEY=$BLOB_KEY" >> $GITHUB_ENV

          # Ensure blob container exists
          az storage container create \
            --name ra-documents \
            --account-name "${{ env.STORAGE_ACCOUNT }}" \
            --account-key "$BLOB_KEY" \
            --auth-mode key || true

      - name: api-prod 배포 (이미지 + 환경 변수)
        id: deploy
        run: |
          RG="${{ env.RESOURCE_GROUP }}"
          APP="${{ env.APP_NAME }}-${{ env.SUFFIX }}"
          ACR_NAME=$(echo "${{ secrets.AZURE_CONTAINER_REGISTRY }}" | cut -d. -f1)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          CCP_FQDN=$(az containerapp show \
            --name "${{ env.CRAWLER_APP_NAME }}" \
            --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)

          # ACR 인증 등록
          az containerapp registry set \
            --name "$APP" --resource-group "$RG" \
            --server "${{ secrets.AZURE_CONTAINER_REGISTRY }}" \
            --username "$ACR_NAME" \
            --password "$ACR_PASS"

          # 시크릿 등록 (Key Vault 값 직접 주입 — Container App revision에 포함되지 않음)
          az containerapp secret set \
            --name "$APP" --resource-group "$RG" \
            --secrets \
              "db-conn=${{ env.DB_CONN }}" \
              "jwt-secret=${{ env.JWT_SEC }}" \
              "minio-pass=${{ env.BLOB_KEY }}" \
              "regula-api-key=${{ secrets.REGULA_API_KEY }}"

          # ingress targetPort 확인 (8000 고정)
          az containerapp ingress update \
            --name "$APP" --resource-group "$RG" \
            --target-port 8000

          # 이미지 + 환경 변수 업데이트 (단일 revision)
          az containerapp update \
            --name "$APP" --resource-group "$RG" \
            --image "${{ env.IMAGE_TAG }}" \
            --set-env-vars \
              "DATABASE_URL=secretref:db-conn" \
              "JWT_SECRET=secretref:jwt-secret" \
              "MINIO_ENDPOINT=https://${{ env.STORAGE_ACCOUNT }}.blob.core.windows.net" \
              "MINIO_USER=${{ env.STORAGE_ACCOUNT }}" \
              "MINIO_PASSWORD=secretref:minio-pass" \
              "MINIO_BUCKET=ra-documents" \
              "OLLAMA_ENDPOINT=http://localhost:11434" \
              "OLLAMA_MODEL=llama3.1:8b" \
              "CLOUD_SYNC_ENDPOINT=https://$CCP_FQDN" \
              "CORS_ORIGINS=https://regula.abyz-lab.work,https://api-prod.victoriousforest-c9f2300f.koreacentral.azurecontainerapps.io" \
              "REGULA_API_KEY=secretref:regula-api-key" \
              "ENVIRONMENT=production" \
              "JWT_TTL_MIN=60" \
              "RATE_LIMIT_PER_MIN=100"

      - name: cloud-control-plane-api 배포 (이미지 + 환경 변수)
        run: |
          RG="${{ env.RESOURCE_GROUP }}"
          ACR_NAME=$(echo "${{ secrets.AZURE_CONTAINER_REGISTRY }}" | cut -d. -f1)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          az containerapp registry set \
            --name "${{ env.CRAWLER_APP_NAME }}" --resource-group "$RG" \
            --server "${{ secrets.AZURE_CONTAINER_REGISTRY }}" \
            --username "$ACR_NAME" \
            --password "$ACR_PASS"

          # ingress targetPort 확인 (8000 고정 — Python uvicorn)
          az containerapp ingress update \
            --name "${{ env.CRAWLER_APP_NAME }}" --resource-group "$RG" \
            --target-port 8000

          az containerapp secret set \
            --name "${{ env.CRAWLER_APP_NAME }}" --resource-group "$RG" \
            --secrets \
              "db-conn=${{ env.DB_CONN }}" \
              "blob-key=${{ env.BLOB_KEY }}" \
              "appi-conn=${{ env.APPI_CONN }}" \
              "regula-push-url=${{ secrets.REGULA_KNOWLEDGE_PUSH_URL }}" \
              "crawl-push-secret=${{ secrets.CRAWL_PUSH_SECRET }}"

          az containerapp update \
            --name "${{ env.CRAWLER_APP_NAME }}" --resource-group "$RG" \
            --image "${{ env.IMAGE_CRAWLER_TAG }}" \
            --set-env-vars \
              "DATABASE_URL=secretref:db-conn" \
              "BLOB_ACCOUNT_NAME=${{ env.STORAGE_ACCOUNT }}" \
              "BLOB_CONTAINER_NAME=ra-documents" \
              "BLOB_ACCOUNT_KEY=secretref:blob-key" \
              "APPINSIGHTS_CONNECTION_STRING=secretref:appi-conn" \
              "CORS_ORIGINS=https://regula.abyz-lab.work" \
              "REGULA_KNOWLEDGE_PUSH_URL=secretref:regula-push-url" \
              "CRAWL_PUSH_SECRET=secretref:crawl-push-secret"

      - name: crawler-job 배포 (이미지 + 환경 변수)
        run: |
          RG="${{ env.RESOURCE_GROUP }}"
          ACR_NAME=$(echo "${{ secrets.AZURE_CONTAINER_REGISTRY }}" | cut -d. -f1)
          ACR_PASS=$(az acr credential show --name "$ACR_NAME" --query "passwords[0].value" -o tsv)

          az containerapp job registry set \
            --name "${{ env.CRAWLER_JOB_NAME }}" --resource-group "$RG" \
            --server "${{ secrets.AZURE_CONTAINER_REGISTRY }}" \
            --username "$ACR_NAME" \
            --password "$ACR_PASS"

          az containerapp job secret set \
            --name "${{ env.CRAWLER_JOB_NAME }}" --resource-group "$RG" \
            --secrets \
              "db-conn=${{ env.DB_CONN }}" \
              "blob-key=${{ env.BLOB_KEY }}" \
              "appi-conn=${{ env.APPI_CONN }}"

          az containerapp job update \
            --name "${{ env.CRAWLER_JOB_NAME }}" --resource-group "$RG" \
            --image "${{ env.IMAGE_CRAWLER_TAG }}" \
            --set-env-vars \
              "DATABASE_URL=secretref:db-conn" \
              "BLOB_ACCOUNT_NAME=${{ env.STORAGE_ACCOUNT }}" \
              "BLOB_CONTAINER_NAME=ra-documents" \
              "BLOB_ACCOUNT_KEY=secretref:blob-key" \
              "APPINSIGHTS_CONNECTION_STRING=secretref:appi-conn"

      - name: 헬스체크
        id: health
        run: |
          sleep 60
          URL=$(az containerapp show \
            --name "${{ env.APP_NAME }}-${{ env.SUFFIX }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f --max-time 30 --retry 5 --retry-delay 15 --retry-connrefused \
            "https://$URL/health" || exit 1
          echo "PROD_URL=https://$URL" >> $GITHUB_OUTPUT

      - name: 배포 실패 시 자동 롤백
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          PREV=$(az containerapp revision list \
            --name "${{ env.APP_NAME }}-${{ env.SUFFIX }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[-2].name" -o tsv)
          az containerapp ingress traffic set \
            --name "${{ env.APP_NAME }}-${{ env.SUFFIX }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision-weight $PREV=100
          echo "::error::헬스체크 실패 — 이전 revision으로 롤백 완료"
