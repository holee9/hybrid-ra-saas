name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: uv 설치
        run: pip install uv

      - name: 의존성 설치
        run: |
          if [ -f pyproject.toml ]; then
            uv pip install --system -e ".[dev]" 2>/dev/null || \
            uv pip install --system -r requirements-dev.txt 2>/dev/null || \
            uv pip install --system -r requirements.txt
          elif [ -f requirements-dev.txt ]; then
            uv pip install --system -r requirements-dev.txt
          else
            uv pip install --system -r requirements.txt
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (단위 테스트)
        run: pytest --cov=app --cov-report=term-missing -m "not integration"
