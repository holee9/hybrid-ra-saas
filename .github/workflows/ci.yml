name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-runtime-python:
    name: Customer Runtime Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest unit suite
        run: uv run python -m pytest -m "not integration" --no-cov

      - name: Parser golden F1 gate
        run: REQUIRE_GOLDEN_DATASET=1 uv run python -m pytest tests/test_golden_f1.py --no-cov

  cloud-control-plane-python:
    name: Cloud Control Plane Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-control-plane

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest unit suite
        run: uv run python -m pytest -m "not integration" --no-cov

  customer-runtime-ui:
    name: Customer Runtime UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-runtime/ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: customer-runtime/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test -- --run

      - name: Build
        run: npm run build
